name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # While the repo is private, the org's self-hosted `light` runners; once it
    # is public, GitHub-hosted runners, so pull requests from forks never run on
    # a self-hosted machine. Nothing here needs a credential.
    runs-on: ${{ github.event.repository.private && 'light' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          # Runner processes share $HOME on the pool; an unscoped install can
          # clobber another job's (pnpm/action-setup#149).
          dest: ~/setup-pnpm-x-slop-hide

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The committed userscript must match the sources it is built from.
      - name: Userscript is current
        run: node scripts/build-userscript.mjs --check

      - name: Userscript parses
        run: node --check dist/x-slop-hide.user.js

      - name: Tests
        run: node --test 'test/*.test.mjs'
