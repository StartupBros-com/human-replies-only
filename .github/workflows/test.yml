name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Not `ubuntu-latest`: GitHub-hosted runs in this org are refused with "the
    # job was not started because recent account payments have failed".
    # `light` is the org-level ARC scale set whose runner group is visible to
    # all repos, so no per-repo registration is needed. Nothing here needs a
    # credential.
    runs-on: light
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          # Runner processes share $HOME on the pool; an unscoped install can
          # clobber another job's (pnpm/action-setup#149).
          dest: ~/setup-pnpm-x-slop-hide

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The committed userscript must match the sources it is built from.
      - name: Userscript is current
        run: node scripts/build-userscript.mjs --check

      - name: Userscript parses
        run: node --check dist/x-slop-hide.user.js

      - name: Tests
        run: node --test 'test/*.test.mjs'
